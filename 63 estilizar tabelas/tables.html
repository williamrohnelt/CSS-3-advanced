<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Tables</title>
    <meta charset="utf-8" />

    <!-- Custom style -->
    <link rel="stylesheet" type="text/css" href="style.css" />

</head>

<body>

    <h2>Styling tables</h2>
    <table>

        <tr>
            <th>Code</th>
            <th>Products</th>
            <th class="number">Price</th>
        </tr>

        <tr>
            <td>001</td>
            <td>Laptop</td>
            <td class="number">$ 2,500.00</td>
        </tr>

        <tr class="alternating">
            <td>002</td>
            <td>Tablet</td>
            <td class="number">$ 1,500.00</td>
        </tr>

        <tr>
            <td>003</td>
            <td>Iphone</td>
            <td class="number">$ 3,500.00</td>
        </tr>

        <tr class="alternating">
            <td>004</td>
            <td>Nexus</td>
            <td class="number">$ 3,500.00</td>
        </tr>

    </table>

</body>

</html>
