<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Styling forms</title>
    <meta charset="utf-8" />

    <!-- Custom style -->
    <link rel="stylesheet" type="text/css" href="style.css" />

</head>

<body>

    <div id="container">

        <img src="images/perfil.png">

        <form>

            <div>
                <input class="email" type="text" name="email" id="email" placeholder="Type your e-mail">
            </div>

            <div>
                <input class="password" type="password" name="password" id="password" placeholder="Type your password">
            </div>

            <div>
                <input class="submit" type="submit" value="Login">
            </div>

        </form>

    </div>

</body>

</html>
